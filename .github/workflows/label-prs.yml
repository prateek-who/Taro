name: Auto-Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  type:
    name: Label from title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Add type label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          TYPE=$(echo "$TITLE" | sed -nE 's/^([a-z]+)(\(.+\))?!?:.*/\1/p')
          case "$TYPE" in
            feat|fix|perf|refactor|docs|chore|ci|build|test) ;;
            *) echo "No conventional type in title"; exit 0 ;;
          esac
          gh label create "$TYPE" --repo "$REPO" --force >/dev/null
          gh pr edit "$PR" --repo "$REPO" --add-label "$TYPE"
