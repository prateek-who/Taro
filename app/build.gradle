plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('_local/keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingValue = { String property, String environment ->
    keystoreProperties.getProperty(property) ?: System.getenv(environment)
}

def releaseStoreFile = signingValue('storeFile', 'KEYSTORE_FILE') ?: (file('keystore.jks').exists() ? 'keystore.jks' : null)

android {
    namespace 'com.prateek.taro'
    compileSdk 35
    defaultConfig {
        applicationId "com.prateek.taro"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 26
        versionName "1.0.4"
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [icon: "@drawable/ic_launcher_debug"]
            applicationIdSuffix ".dev"
            versionNameSuffix '-dev'
            minifyEnabled false
        }
        release {
            manifestPlaceholders = [icon: "@drawable/ic_launcher"]
            minifyEnabled true
            shrinkResources true
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        compose true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

}

kotlin {
    jvmToolchain(21)
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'cafe.adriel.voyager:voyager-navigator:1.1.0-beta03'
    implementation 'cafe.adriel.voyager:voyager-transitions:1.1.0-beta03'
    implementation 'cafe.adriel.voyager:voyager-tab-navigator:1.1.0-beta03'
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    ksp 'androidx.room:room-compiler:2.7.2'
    testImplementation 'androidx.room:room-testing:2.7.2'

    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation "androidx.work:work-runtime-ktx:2.10.1"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "androidx.lifecycle:lifecycle-process:2.9.1"


    implementation "androidx.datastore:datastore-preferences:1.1.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.1"

    implementation 'com.google.android.gms:play-services-base:18.10.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}